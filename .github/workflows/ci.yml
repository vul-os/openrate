name: CI

on:
  push:
  pull_request:

jobs:
  # The release verifier is only worth having if its REFUSALS are exercised. A
  # checksum guard that has quietly stopped failing is indistinguishable, from a
  # green CI run, from one that works — so run the full synthetic-origin failure
  # matrix on every push, not only at release time.
  verify-script:
    name: Release verifier — lint & failure matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/verify.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh

      # 24 cases; each is a synthetic origin broken in exactly one way. The
      # matrix asserts the exit code AND that a diagnostic was printed, because
      # "aborted with no message" was the real-world bug being guarded against.
      - name: Failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest

  go-ci:
    name: Go build / test / vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # Formatting is a build gate, not a review comment.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
          echo "all files gofmt-clean"

      - name: Test
        run: go test ./...

      # The store swaps an immutable snapshot under an RWMutex while readers hit
      # it concurrently; several tests exist specifically to drive that race.
      # They only prove anything under -race.
      - name: Test (race detector)
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      # site/docs used to be a hand-made copy of the canonical docs, and it
      # drifted silently — that drift is how four EMPTY link targets shipped in
      # site/docs/api.md. site/docs is now generated by ./site/gen, and this
      # gate fails if the shipped bundle is stale, if a canonical doc is neither
      # published nor explicitly exempt, or if any link would be dead for a
      # visitor. It is run explicitly (not just via `go test ./...`) so the
      # failure is legible, and it asserts coverage floors so it cannot pass by
      # checking nothing.
      - name: Docs — site/docs generated, in sync, and link-clean
        run: go test ./site/gen -v

  # The web UI is embedded into the binary (web/embed.go embeds web/dist), so a
  # bundle that builds but does not RUN ships a blank screen to every user. The
  # E2E suite boots the BUILT bundle in real chromium and fails on any uncaught
  # exception or an empty root — the check `vite build` cannot make.
  web-e2e:
    name: Web — build & boot the bundle in a real browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      # `npm test` → pretest:e2e (vite build) → playwright test
      - name: Boot guard + E2E
        run: npm test

      # web/dist is COMMITTED and embedded into the Go binary by web/embed.go, so
      # the bundle a user runs is the one in git — not the one CI just built. If
      # someone edits web/src without rebuilding, every release ships the old UI
      # and nothing else notices. The build above is byte-reproducible, so any
      # diff here means the committed bundle is stale.
      - name: Committed web/dist is up to date with web/src
        working-directory: .
        run: |
          # `git diff` alone is blind to files vite ADDS (content-hashed chunk
          # names change when their source changes, so a stale build often
          # leaves an old committed chunk untouched and adds a new untracked
          # one rather than modifying a tracked path). `git add -N` records
          # untracked paths as empty intent-to-add blobs first, so an added
          # file shows up as a diff instead of silently passing.
          git add -N -- web/dist
          if ! git diff --exit-code -- web/dist; then
            echo "::error::web/dist is stale. Run 'npm --prefix web run build' and commit the result."
            exit 1
          fi
          echo "committed web/dist matches a fresh build"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openrate-playwright-report
          path: web/playwright-report/
          retention-days: 7
