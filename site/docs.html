/* Same three-state resolution as index.html, before first paint: a stored
   choice wins, otherwise prefers-color-scheme, otherwise the data-theme="dark"
   already on <html>. Kept inline and duplicated rather than shared with
   site.js, because site.js is deferred and anything deferred runs after the
   first paint — which is the flash this exists to prevent. */
try {
  /* Only a value marked by "or-theme-set" counts as a choice. Both this site
     and the app at /ui used to write "or-theme" on every load, so a reader who
     merely visited is carrying a theme they never picked — and it would
     otherwise outrank their machine forever. Unmarked falls through to the OS. */
  var t = localStorage.getItem("or-theme-set") === "1" ? localStorage.getItem("or-theme") : null;
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : null;
  }
  if (t) {
    document.documentElement.dataset.theme = t;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "dark" ? "#06090E" : "#F2EFE6");
  }
} catch (e) {}
document.documentElement.classList.add("js");

<script>
/* openrate docs viewer.
 *
 * site/docs/*.md is GENERATED from the canonical docs by `go run ./site/gen` —
 * never hand-edit those files. The DOCS array below is the nav contract, and
 * two separate gates hold it to the rest of the site: site/gen/gen_test.go
 * parses it out of this file and fails if the slugs drift from the pages the
 * generator actually produces, and scripts/check-docs-chrome.mjs fails if a
 * page's `group` here disagrees with the group its link sits in above. Keep it
 * JSON-parseable, on one line, and keep every slug mirrored by a data-slug
 * link in the sidebar.
 */
const DOCS = [{"slug":"overview","title":"Overview","group":"Start here"},{"slug":"quickstart","title":"Quickstart","group":"Start here"},{"slug":"deployment-modes","title":"Choosing a mode","group":"Start here"},{"slug":"library","title":"Go library","group":"Embedding"},{"slug":"zero-network","title":"Zero network","group":"Embedding"},{"slug":"c-abi","title":"Other languages","group":"Embedding"},{"slug":"configuration","title":"Configuration","group":"Run the server"},{"slug":"api","title":"API reference","group":"Run the server"},{"slug":"web-ui","title":"Web console","group":"Run the server"},{"slug":"graph-model","title":"Graph model","group":"The numbers"},{"slug":"accuracy","title":"Accuracy","group":"The numbers"},{"slug":"sources","title":"Sources","group":"The numbers"},{"slug":"interest-rates","title":"Interest rates","group":"The numbers"},{"slug":"troubleshooting","title":"Troubleshooting","group":"Help"}];

const bySlug = Object.fromEntries(DOCS.map(d => [d.slug, d]));
const content = document.getElementById("content");
const crumb = document.getElementById("crumb");
const cache = {};

if (window.marked && marked.setOptions) marked.setOptions({ gfm: true, breaks: false });

function setActive(slug) {
  document.querySelectorAll("#nav a[data-slug]").forEach(a => {
    const on = a.dataset.slug === slug;
    a.classList.toggle("active", on);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

/* ── collapsible groups ───────────────────────────────────────────────────
 * Fourteen pages is where a flat list stops being an index and starts being a
 * wall, so the pages are grouped — and a group you can't close is only a
 * heading. State lives in localStorage rather than the URL because it is a
 * preference about the furniture, not about what you are reading.
 *
 * Two rules keep it from ever hiding the thing you want:
 *
 *   the group holding the page you are ON is forced open, whatever was stored.
 *   Otherwise a reader who collapsed "Embedding", then followed a link into
 *   the C ABI page, would be looking at a sidebar that does not contain the
 *   page they are reading.
 *
 *   a group with no stored entry is open. Absence means "not decided", never
 *   "closed" — a fresh reader sees everything.
 *
 * The buttons and sections are in the MARKUP, not built here, so the grouping
 * survives with scripting off; this only adds the toggle. */
const GRP_KEY = "or-docs-groups";
const groups = [...document.querySelectorAll(".nav-group")];

function readClosed() {
  try {
    const v = JSON.parse(localStorage.getItem(GRP_KEY) || "[]");
    return new Set(Array.isArray(v) ? v : []);
  } catch (e) { return new Set(); }
}
function writeClosed(set) {
  try { localStorage.setItem(GRP_KEY, JSON.stringify([...set])); } catch (e) { /* private mode */ }
}
function setGroup(sec, open) {
  sec.classList.toggle("collapsed", !open);
  sec.querySelector(".nav-grp").setAttribute("aria-expanded", open ? "true" : "false");
}
for (const sec of groups) {
  const btn = sec.querySelector(".nav-grp");
  const items = sec.querySelector(".nav-items");
  // The button controls the item list; give the list an id so it can say so.
  const id = "grp-" + sec.dataset.group.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  items.id = id;
  btn.setAttribute("aria-controls", id);
  btn.addEventListener("click", () => {
    const open = sec.classList.contains("collapsed");
    setGroup(sec, open);
    const closed = readClosed();
    if (open) closed.delete(sec.dataset.group); else closed.add(sec.dataset.group);
    writeClosed(closed);
  });
}
function applyGroups(activeSlug) {
  const closed = readClosed();
  for (const sec of groups) {
    const holdsActive = !!sec.querySelector(`a[data-slug="${activeSlug}"]`);
    setGroup(sec, holdsActive || !closed.has(sec.dataset.group));
  }
}

/* ── the index disclosure ─────────────────────────────────────────────────
 * Only does anything below 980px, where site.css turns the rail into a bar
 * with the panel out of flow behind it. Above that the button is display:none
 * and the panel is permanently laid out, so the class this toggles is inert. */
const side = document.getElementById("side");
const tocBtn = document.getElementById("tocbtn");
const tocHere = document.getElementById("tochere");

function setToc(open) {
  side.classList.toggle("open", open);
  tocBtn.setAttribute("aria-expanded", open ? "true" : "false");
  // Opening a panel and leaving focus on the button behind it means a keyboard
  // reader has to tab past the button to reach what just appeared. Send focus
  // into the panel, at the one control that can reach any of the fourteen
  // pages in one step.
  if (open) q.focus();
}
tocBtn.addEventListener("click", () => setToc(!side.classList.contains("open")));
// Closing on the choice, on Escape, and on a tap outside — the three ways a
// reader signals they are done with a panel that covers what they were reading.
side.addEventListener("click", e => { if (e.target.closest("#nav a, .hit")) setToc(false); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && side.classList.contains("open")) { setToc(false); tocBtn.focus(); }
});
document.addEventListener("click", e => {
  if (side.classList.contains("open") && !e.target.closest(".docs-side")) setToc(false);
});

/* ── the sidebar's own scroll position ────────────────────────────────────
 * The index is taller than a short window, and every navigation used to send
 * it back to the top — so a reader working through "The numbers" was scrolling
 * the sidebar back down after every click. sessionStorage, not localStorage:
 * where you were in the index is a fact about this visit, not a preference.
 *
 * Written on a rAF-throttled scroll listener rather than on navigation,
 * because the panel can also be scrolled and then left alone. */
const SCROLL_KEY = "or-docs-side-scroll";
let sideTick = false;
side.addEventListener("scroll", () => {
  if (sideTick) return;
  sideTick = true;
  requestAnimationFrame(() => {
    sideTick = false;
    try { sessionStorage.setItem(SCROLL_KEY, String(side.scrollTop)); } catch (e) {}
  });
}, { passive: true });
function restoreSideScroll() {
  try {
    const v = parseFloat(sessionStorage.getItem(SCROLL_KEY) || "0");
    if (v > 0) side.scrollTop = v;
  } catch (e) {}
}

async function fetchDoc(slug) {
  if (cache[slug] !== undefined) return cache[slug];
  const res = await fetch("./docs/" + slug + ".md", { cache: "no-cache" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  cache[slug] = await res.text();
  return cache[slug];
}

/* ── the README's masthead is not documentation ───────────────────────────
 * Page one of the docs is the README, generated verbatim into
 * site/docs/overview.md — and a README opens with the repository's front
 * door: a centred logo tile, the wordmark, the tagline, a row of ten links,
 * the release line and the licence line. In THIS viewer the header directly
 * above already shows that mark and that wordmark, and the sidebar to the
 * left already IS that row of links. A reader who clicks "Docs" was getting
 * the front door a second time, and at 390 it filled the entire first screen
 * before a single line of documentation.
 *
 * It is fixed here rather than in the file, because the file is generated
 * (`go run ./site/gen`) and rather than in the README, because on GitHub that
 * masthead is exactly right. Same bytes, rendered for where they are read.
 *
 * What survives is the shape every other page of these docs already has —
 * eyebrow, title, one-line lede, rule, prose. Only the repository furniture
 * goes: the logo tile (an <img> and nothing else), the link row (three or
 * more links in one centred block) and the two <sub> lines of small print.
 *
 * MASTHEAD-BEGIN — lifted out and EXECUTED against the real overview.md by
 * scripts/check-docs-chrome.mjs, so this must stay a pure function of a
 * string: no DOM, no closure over anything above it. */
function stripMasthead(md) {
  const none = { md: md, dropped: 0, uncentred: 0 };
  const lines = md.split("\n");
  // A masthead is the run before the document's first thematic break. Sixty
  // lines in, whatever this is, it is the document.
  let end = -1;
  for (let i = 0; i < Math.min(lines.length, 60); i++) {
    if (/^\s*---\s*$/.test(lines[i])) { end = i; break; }
  }
  if (end < 0) return none;
  const head = lines.slice(0, end).join("\n");
  if (!/align="center"/.test(head)) return none;

  let dropped = 0, uncentred = 0;
  const kept = [];
  for (const block of head.split(/\n[ \t]*\n/)) {
    // Comments render as nothing, so they decide nothing about a block.
    const code = block.replace(/<!--[\s\S]*?-->/g, "");
    if (!/align="center"/.test(code)) { if (code.trim()) kept.push(block); continue; }
    const text = code.replace(/<[^>]*>/g, "").replace(/&[#\w]+;/g, "").trim();
    const links = (code.match(/<a\b/gi) || []).length;
    if (!text) { dropped++; continue; }                 // the logo tile
    if (/<sub\b/i.test(code)) { dropped++; continue; }  // release + licence small print
    if (links >= 3) { dropped++; continue; }            // the row of links that IS the sidebar
    uncentred++;
    kept.push(block.replace(/ align="center"/g, ""));
  }
  if (!dropped && !uncentred) return none;
  return { md: kept.join("\n\n") + "\n\n" + lines.slice(end).join("\n"), dropped: dropped, uncentred: uncentred };
}
/* MASTHEAD-END */

/* ── code blocks ──────────────────────────────────────────────────────────
 * Every fenced block is given the same chrome the landing's terminal and
 * response plates have: a bar naming the language, with the copy control in
 * it. The control used to float over the block's first line at 48.8x31px and
 * appear only on hover — under the tap-target floor, and on a touch screen,
 * which has no hover, it did not exist at all.
 *
 * The bar is also where the block declares how it behaves when the column is
 * narrower than its longest line, and that is decided by what the block IS:
 *
 *   a block in a real language  soft-wraps, with the hanging indent site.js
 *                               and site.css build between them, so a
 *                               continuation is never read as a new line
 *   an unfenced plaintext block keeps its lines and scrolls, because these
 *                               are the listings whose columns are their
 *                               meaning — overview.md's repository map puts
 *                               its description column at a fixed offset on
 *                               every row, and wrapping it destroys the only
 *                               structure it has
 *
 * Two blocks in the whole corpus take the second path, and both say so in the
 * bar rather than leaving the reader to find the scroll by dragging.
 */
const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const DONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 7"/></svg>';

// Whether a scrolling block is currently scrolling is a measurement, not a
// property of the block: interest-rates.md's series-ID grammar is 23 columns
// wide and keeps its lines like every other unfenced listing, but it fits in
// any column this site has and must not claim otherwise.
let scrollers = [];
function updateScrollHints() {
  for (const s of scrollers) s.hint.classList.toggle("on", s.pre.scrollWidth - s.pre.clientWidth > 2);
}
window.addEventListener("resize", updateScrollHints);

function dressCodeBlocks() {
  scrollers = [];
  content.querySelectorAll("pre").forEach(pre => {
    const code = pre.querySelector("code");
    const cls = code ? code.className : "";
    const lang = (cls.match(/language-([\w-]+)/) || [])[1] || "";
    // No language on the fence means no grammar to wrap along; those blocks
    // are the aligned listings, so they keep their lines and scroll.
    const wraps = !!lang;
    pre.classList.add(wraps ? "cb-wrap" : "cb-scroll");
    if (!wraps) pre.classList.add("or-scroll");

    const box = document.createElement("div");
    box.className = "codeblock";
    pre.parentNode.insertBefore(box, pre);

    const bar = document.createElement("div");
    bar.className = "cb-bar";
    const name = document.createElement("span");
    name.className = "cb-lang";
    name.textContent = lang || "text";
    const hint = document.createElement("span");
    hint.className = "cb-hint";
    hint.textContent = "scrolls →";
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.type = "button";
    btn.setAttribute("aria-label", "Copy this " + (lang || "text") + " block");
    btn.innerHTML = COPY_ICON + "<span>copy</span>";
    bar.append(name, hint, btn);
    box.append(bar, pre);
    if (!wraps) scrollers.push({ pre, hint });

    // The lines are block boxes now, so textContent runs them together —
    // rebuild the source from them. navigator.clipboard is undefined on an
    // insecure origin, so a failure is swallowed rather than thrown into the
    // console.
    btn.addEventListener("click", () => {
      const lines = code ? code.querySelectorAll(".cl") : [];
      const text = lines.length
        ? [...lines].map(l => l.textContent).join("\n")
        : (code ? code.textContent : pre.textContent);
      navigator.clipboard?.writeText(text).then(() => {
        btn.classList.add("done");
        btn.innerHTML = DONE_ICON + "<span>copied</span>";
        setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = COPY_ICON + "<span>copy</span>"; }, 1400);
      }, () => {});
    });
  });
}

/* ── tables ───────────────────────────────────────────────────────────────
 * Two changes, both about what a table can do that a phone cannot.
 *
 * The scroll moves off the <table> and onto a wrapper. A <table> carrying
 * `display: block; overflow-x: auto` sizes its anonymous inner table to
 * max-content, so it takes its preferred width and scrolls even when the
 * column is wide enough for it — which is why sources.md's eight-column feed
 * matrix was 1150px on a 1440px desktop that had room for it.
 *
 * And every cell is labelled with its column heading, so that below 620px a
 * table of three or more columns can stop being a grid and become one card
 * per row (see site.css). Eight columns of prose at 354px is not a table
 * anybody can read at any column width; labelled rows are.
 */
function dressTables() {
  content.querySelectorAll("table").forEach(table => {
    const heads = [...table.querySelectorAll("thead th")].map(th => th.textContent.trim());
    if (heads.length) {
      table.dataset.cols = heads.length;
      table.querySelectorAll("tbody tr").forEach(tr => {
        [...tr.children].forEach((cell, i) => {
          if (heads[i]) cell.setAttribute("data-th", heads[i]);
        });
      });
    }
    const wrap = document.createElement("div");
    wrap.className = "table-scroll or-scroll on-page";
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });
  applyStacking();
}

/* How a table copes with a narrow column is measured, not guessed at with a
 * breakpoint. The width at which one gives up depends entirely on what is in
 * it: a two-column key/value list reads correctly at 320px, while sources.md's
 * eight-column feed matrix needs about 845px and therefore gives up on most
 * laptops. Any single media query is wrong for one of them, and a
 * per-column-count guess was wrong in a subtler way — it stacked tables that
 * would have fitted, and left tables tabular that then "fitted" only by
 * breaking every heading down its own column, SOUR/CE and DEF/AUL/T.
 *
 * So each table is laid out, asked whether it overflowed, and given the least
 * disruptive answer that works:
 *
 *   1. fits            leave it alone
 *   2. .brk            let the long `code` tokens inside cells break, which is
 *                      usually enough for a table held open by one identifier
 *   3. .stack          give up on columns: one card per row, cells labelled
 *
 * Each step is only taken because the one before it was measured and failed,
 * so a table never pays for a problem it does not have — which matters,
 * because step 2 lowers a column's min-content and the auto layout will then
 * hand it less space even where it was fitting comfortably.
 *
 * Every step un-does the later ones before measuring: a stacked table never
 * overflows, so without that it would stay stacked forever once the window
 * grew back.
 */
function applyStacking() {
  const tables = [...content.querySelectorAll("table[data-cols]")];
  const overflows = t => t.parentElement && t.parentElement.scrollWidth - t.parentElement.clientWidth > 2;
  const stacked = (t, on) => {
    t.classList.toggle("stack", on);
    if (t.parentElement) t.parentElement.classList.toggle("stacked", on);
  };
  // Batched write-then-read per step, rather than thrashing layout per table.
  for (const t of tables) { t.classList.remove("brk"); stacked(t, false); }
  const wide = tables.filter(overflows);
  for (const t of wide) t.classList.add("brk");
  const stillWide = wide.filter(overflows);
  for (const t of stillWide) stacked(t, true);
}
window.addEventListener("resize", applyStacking);
// A table measured before the mono/sans faces have swapped in is measured
// against the fallback's metrics, which is how one of them came back 5px over
// a decision that had already been made. Re-ask once the real faces land.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(applyStacking);

/* ── the on-this-page rail ────────────────────────────────────────────────
 * Fills the grid track that used to be reserved and empty (see the .docs
 * block in site.css for the geometry). Built here rather than written into
 * the markup because the headings only exist once the markdown has been
 * fetched and rendered.
 *
 * Two things worth knowing about how it navigates:
 *
 *   The ids are minted here. marked 16 emits bare <h2>/<h3> with no id — the
 *   slugger was removed from core — so there is nothing to link to until we
 *   make it. Slugs are de-duplicated per page, because a document is allowed
 *   two sections with the same title and two elements are not allowed the
 *   same id.
 *
 *   A rail link must NOT put its target in location.hash, which is why the
 *   click is intercepted. This page routes the DOCUMENT on the hash — #api
 *   means api.md — so letting `#deployment-modes` reach the address bar would
 *   fire hashchange, fail to find a doc by that slug, and silently reload
 *   Overview underneath the reader. The href is still a real fragment so the
 *   link works as a link (middle-click, copy, keyboard); only the default
 *   scroll is replaced, and focus is moved to the heading so a keyboard
 *   reader lands where a mouse reader is looking. scrollIntoView with no
 *   argument takes html's own scroll-behavior, so the reduced-motion override
 *   in site.css turns the animation off without a second code path.
 */
const docsGrid = document.querySelector(".docs");
const rail = document.createElement("nav");
rail.className = "docs-rail";
rail.setAttribute("aria-label", "On this page");
docsGrid.appendChild(rail);

/* One listener for the life of the page, calling whatever the current page's
 * rail installed here. An IntersectionObserver was the first attempt and is
 * the wrong instrument: it reports state CHANGES, so between two headings
 * that both left the root in the same jump there is no callback, and the mark
 * simply stopped on whichever one last fired (it sat on "Embed as a Go
 * library" while "Deployment modes" was on screen). Scroll position is what
 * the answer actually depends on, so that is what it is computed from —
 * rAF-throttled, passive, and doing nothing at all on the pages and widths
 * where no rail is drawn. */
let railMark = null, railTick = false;
function railSchedule() {
  if (railTick || !railMark) return;
  railTick = true;
  requestAnimationFrame(() => { railTick = false; if (railMark) railMark(); });
}
window.addEventListener("scroll", railSchedule, { passive: true });
window.addEventListener("resize", railSchedule);

function slugify(s, taken) {
  let base = s.toLowerCase().trim()
    .replace(/[`*_~]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "") || "section";
  let slug = base, n = 2;
  while (taken.has(slug)) slug = base + "-" + n++;
  taken.add(slug);
  return slug;
}

/* Jumping to a heading is the same act from the rail and from the sidebar, and
 * it is not a plain anchor in either: this page routes the DOCUMENT on
 * location.hash, so letting `#deployment-modes` reach the address bar would
 * fire hashchange, fail to find a doc by that slug, and reload Overview
 * underneath the reader. See the long note above. */
function jumpTo(h) {
  h.scrollIntoView();
  h.setAttribute("tabindex", "-1");   // -1 so it takes focus without joining the tab order
  h.focus({ preventScroll: true });
}

/* ── in-page headings, in the sidebar ─────────────────────────────────────
 * The rail is the on-this-page navigation, and above 1380px it is the right
 * answer: its own column, out of the way. Below that width there is no third
 * track and the rail is not drawn at all — which used to mean that a phone,
 * a tablet and most laptop windows had NO way to see the shape of a document
 * or jump within it. Fourteen pages made that worse, not better.
 *
 * So the sidebar grows the same list, nested under the page it belongs to, and
 * CSS shows it exactly where the rail is absent (see the .nav-heads block in
 * site.css). Two lists, never both on screen, one scroll-spy driving both.
 *
 * H2 only. The rail carries H3s indented under their H2; repeating that depth
 * inside a nested list inside a nav is a fourth level of indentation on a
 * 256px column, and the sidebar's job here is the shape of the page rather
 * than every subsection of it. */
function buildNavHeads(slug, heads) {
  const old = document.querySelector(".nav-heads");
  if (old) old.remove();
  const link = document.querySelector(`#nav a[data-slug="${slug}"]`);
  if (!link) return new Map();

  const h2s = heads.filter(h => h.tagName === "H2");
  if (h2s.length < 2) return new Map();

  const list = document.createElement("ol");
  list.className = "nav-heads";
  list.setAttribute("aria-label", "On this page");
  const links = new Map();
  for (const h of h2s) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = h.textContent;
    a.addEventListener("click", e => {
      e.preventDefault();
      jumpTo(h);
      // On a phone the index is a panel covering the document; choosing a
      // heading in it means "take me there", so it has to close.
      setToc(false);
    });
    li.appendChild(a);
    list.appendChild(li);
    links.set(h, a);
  }
  link.after(list);
  return links;
}

function buildRail() {
  railMark = null;
  rail.innerHTML = "";
  const heads = [...content.querySelectorAll("h2, h3")];
  const taken = new Set();
  for (const h of heads) if (!h.id) h.id = slugify(h.textContent, taken);

  const navLinks = buildNavHeads(currentSlug, heads);

  // Below three entries a rail is more furniture than navigation, and an
  // empty-looking third column is the exact thing this replaced. The grid
  // drops back to two tracks instead. The sidebar's copy is built either way:
  // it costs no column, and its own floor (two headings) is decided above.
  docsGrid.classList.toggle("no-rail", heads.length < 3);
  if (heads.length < 3) {
    if (navLinks.size) railMark = () => markHeadings(heads, navLinks);
    railMark?.();
    return;
  }

  const label = document.createElement("span");
  label.className = "lbl";
  label.textContent = "On this page";
  const list = document.createElement("ol");
  const links = new Map();

  for (const h of heads) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = h.textContent;
    if (h.tagName === "H3") a.className = "sub";
    a.addEventListener("click", e => { e.preventDefault(); jumpTo(h); });
    li.appendChild(a);
    list.appendChild(li);
    links.set(h, a);
  }
  rail.append(label, list);

  railMark = () => markHeadings(heads, links, navLinks);
  railMark();
}

/* Which heading you are "in" is the last one to have crossed the top of the
 * viewport, not whichever happens to be intersecting — on a long section
 * nothing is intersecting at all, and on a short one several are. Headings are
 * in document order, so the scan stops at the first one still below the line,
 * and every position it reads is read now rather than remembered.
 *
 * (An IntersectionObserver was the first attempt and is the wrong instrument
 * here for the reason given above railSchedule. It is worth repeating that the
 * same property makes an IO hard to TEST: a fast programmatic scroll does not
 * fire one at all, so a blank result from an automated scroll can be a capture
 * artifact rather than a bug. This reads positions synchronously and has
 * neither problem.)
 *
 * The rail and the sidebar's nested list are the same navigation drawn twice,
 * never both visible, so one pass marks both from one measurement. */
function markHeadings(heads, ...maps) {
  let current = heads[0];
  for (const h of heads) {
    if (h.getBoundingClientRect().top <= 120) current = h;
    else break;
  }
  for (const links of maps) {
    if (!links || !links.size) continue;
    for (const [h, a] of links) a.classList.toggle("here", h === current);
    const on = links.get(current);
    // Keep the marked entry in view when the rail is taller than its box, but
    // never scroll the page itself doing it. The RAIL only: the sidebar is the
    // whole index and the reader controls where it sits — moving it under them
    // as they scroll the document would undo the position this page now
    // deliberately remembers.
    if (!on) continue;
    const box = on.closest(".docs-rail");
    if (box && box.scrollHeight > box.clientHeight) {
      const r = on.getBoundingClientRect(), b = box.getBoundingClientRect();
      if (r.top < b.top || r.bottom > b.bottom) {
        box.scrollTop += r.top - b.top - b.height / 2 + r.height / 2;
      }
    }
  }
}

let currentSlug = DOCS[0].slug;

async function load(slug) {
  const doc = bySlug[slug] || DOCS[0];
  currentSlug = doc.slug;
  setActive(doc.slug);
  applyGroups(doc.slug);
  crumb.textContent = doc.title;
  tocHere.textContent = doc.title;
  document.title = "openrate — " + doc.title;
  content.innerHTML = "Loading…";
  try {
    content.innerHTML = marked.parse(stripMasthead(await fetchDoc(doc.slug)).md);
    content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    if (window.orHighlight) window.orHighlight(content);
    // Not highlighted, so not re-lined by site.js — but a plaintext block
    // still needs its line boxes, both for the empty-line height and so the
    // copy control has the same thing to read back everywhere.
    if (window.orReline) {
      content.querySelectorAll("pre > code:not([data-hl-done])").forEach(el => {
        window.orReline(el);
        el.dataset.hlDone = "1";
      });
    }
    dressCodeBlocks();
    dressTables();
    buildRail();
    buildPager(doc.slug);
    updateScrollHints();
    window.scrollTo({ top: 0 });
  } catch (err) {
    pager.hidden = true;
    docsGrid.classList.add("no-rail");
    rail.innerHTML = "";
    railMark = null;
    document.querySelector(".nav-heads")?.remove();
    content.innerHTML = '<div class="docs-err">Could not load <code>' + doc.slug +
      ".md</code> — " + err.message + "</div>";
  }
}

/* ── previous / next ──────────────────────────────────────────────────────
 * DOCS is already in reading order, so the neighbours are just i±1. The first
 * and last documents render one card rather than an empty half. */
const pager = document.getElementById("pager");

function buildPager(slug) {
  const i = DOCS.findIndex(d => d.slug === slug);
  if (i < 0) { pager.hidden = true; return; }
  const prev = DOCS[i - 1], next = DOCS[i + 1];
  let html = "";
  if (prev) html += '<a class="prev" href="#' + prev.slug + '"><span class="dir">Previous</span><span class="t">' + esc(prev.title) + "</span></a>";
  if (next) html += '<a class="next" href="#' + next.slug + '"><span class="dir">Next</span><span class="t">' + esc(next.title) + "</span></a>";
  pager.innerHTML = html;
  pager.hidden = !html;
}

/* The same path, without scrolling to the bottom to find it. Guarded exactly
 * as "/" is: never while the reader is typing, never with a modifier held
 * (⌘←/⌥← are browser history and word-jump), and never while the mobile
 * sidebar is open, where the arrows belong to the list inside it. */
document.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  const el = document.activeElement;
  if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return;
  if (side.classList.contains("open")) return;
  const i = DOCS.findIndex(d => d.slug === currentSlug);
  if (i < 0) return;
  const to = DOCS[e.key === "ArrowLeft" ? i - 1 : i + 1];
  if (!to) return;
  e.preventDefault();
  location.hash = "#" + to.slug;
});

/* ── search ───────────────────────────────────────────────────────────────
 * Fourteen documents is still small enough to search by fetching all of them
 * once, on the first keystroke, and scanning line by line. No index to build,
 * nothing to keep in sync with the generator, and it stays correct
 * automatically as pages are added.
 *
 * What did have to change with fourteen pages is ORDER. A line scan returns
 * whatever it meets first, in page order, and "engine" matched forty lines of
 * prose before it matched the section actually called "The split that makes it
 * true". So matches are ranked, best first:
 *
 *   0  a page TITLE matches            — you are looking for the page
 *   1  a HEADING matches               — you are looking for a section, and a
 *                                        heading hit navigates INTO the page,
 *                                        not just to the top of it
 *   2  a line of prose matches
 *
 * A heading hit carries the heading's own slug, computed with the same
 * slugify() the rail and the sidebar use, so clicking it lands on the section
 * rather than the document. It has to route in two steps — load the document,
 * then jump — because the hash is the document route. */
const q = document.getElementById("q");
const hits = document.getElementById("hits");
let corpus = null;

async function ensureCorpus() {
  if (corpus) return corpus;
  const bodies = await Promise.all(DOCS.map(d => fetchDoc(d.slug).catch(() => "")));
  corpus = DOCS.map((d, i) => {
    const lines = bodies[i].split("\n");
    // Headings, with the id the viewer will mint for them. slugify de-dupes
    // per page, so the sequence here has to match the sequence there: same
    // order, same Set, one pass.
    const taken = new Set();
    const heads = [];
    let inFence = false;
    for (const line of lines) {
      if (/^\s*(```|~~~)/.test(line)) { inFence = !inFence; continue; }
      if (inFence) continue;
      const m = /^(#{2,3})\s+(.*)$/.exec(line);
      if (!m) continue;
      const text = m[2].replace(/[`*_~]/g, "").trim();
      heads.push({ text, id: slugify(text, taken) });
    }
    return { doc: DOCS[i], lines, heads };
  });
  return corpus;
}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* A prose hit is one raw markdown line, and the reader is being shown it as a
 * sentence. Unwrap links to their label first — otherwise a match inside one
 * renders as `[the Engine-without-a-Refresher example](library)`, which reads
 * as a bug in the search rather than as source text — then drop the emphasis,
 * fence and table punctuation and any leading list marker. */
function excerpt(s) {
  return s
    .replace(/!?\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/^[-*+]\s+|^\d+\.\s+|^>\s*/, "")
    .replace(/[*`>|]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, 90);
}

function search(term) {
  const t = term.trim().toLowerCase();
  if (t.length < 2) { closeHits(); return; }
  ensureCorpus().then(rows => {
    // Re-check: an await means the box may have changed since this ran.
    if (q.value.trim().toLowerCase() !== t) return;
    const out = [];
    for (const { doc, lines, heads } of rows) {
      if (doc.title.toLowerCase().includes(t)) {
        out.push({ rank: 0, doc, label: doc.title, sub: doc.group, id: "" });
      }
      for (const h of heads) {
        if (h.text.toLowerCase().includes(t)) out.push({ rank: 1, doc, label: h.text, sub: doc.title, id: h.id });
      }
      let n = 0;
      for (const line of lines) {
        if (n >= 3) break;
        const s = line.trim();
        if (s.length < 3 || s.startsWith("<!--") || s.startsWith("#") || !s.toLowerCase().includes(t)) continue;
        out.push({ rank: 2, doc, label: excerpt(s), sub: doc.title, id: "" });
        n++;
      }
    }
    out.sort((a, b) => a.rank - b.rank);
    const shown = out.slice(0, 12);
    hits.hidden = false;
    q.setAttribute("aria-expanded", "true");
    hits.innerHTML = shown.length
      ? shown.map((h, i) =>
          '<a class="hit" role="option" id="hit-' + i + '" aria-selected="false" href="#' + h.doc.slug +
          '" data-slug="' + h.doc.slug + '" data-id="' + esc(h.id) + '"><b>' + esc(h.label) +
          "</b><span>" + esc(h.sub || "") + "</span></a>"
        ).join("")
      : '<div class="hits-none">Nothing matches “' + esc(t) + "”.</div>";
    cursor = -1;
  });
}

/* ── keyboard, over the results and over the page ─────────────────────────
 * The results are a listbox the search box owns (role=combobox +
 * aria-activedescendant), so a keyboard reader hears the highlighted result
 * change without focus ever leaving the input. Down/Up move, Enter opens,
 * Escape clears — and Escape on an empty box gives up focus rather than doing
 * nothing, which is what a reader who wanted out of the search expects. */
let cursor = -1;

function closeHits() {
  hits.hidden = true;
  hits.innerHTML = "";
  cursor = -1;
  q.setAttribute("aria-expanded", "false");
  q.removeAttribute("aria-activedescendant");
}

function moveCursor(delta) {
  const opts = [...hits.querySelectorAll(".hit")];
  if (!opts.length) return;
  cursor += delta;
  if (cursor < 0) cursor = opts.length - 1;
  if (cursor >= opts.length) cursor = 0;
  opts.forEach((o, i) => {
    const on = i === cursor;
    o.classList.toggle("on", on);
    o.setAttribute("aria-selected", on ? "true" : "false");
  });
  const on = opts[cursor];
  q.setAttribute("aria-activedescendant", on.id);
  on.scrollIntoView({ block: "nearest" });
}

function openHit(a) {
  const slug = a.dataset.slug, id = a.dataset.id;
  q.value = "";
  closeHits();
  setToc(false);
  const go = () => { if (id) { const h = document.getElementById(id); if (h) jumpTo(h); } };
  if (slug === currentSlug) { go(); return; }
  // The hash is the document route; the heading is a second step, once the
  // document it lives in has actually been rendered.
  if (location.hash.replace("#", "") === slug) load(slug).then(go);
  else { pendingJump = id; location.hash = "#" + slug; }
}
let pendingJump = "";

q.addEventListener("input", () => search(q.value));
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveCursor(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveCursor(-1); }
  else if (e.key === "Enter") {
    const on = hits.querySelectorAll(".hit")[cursor];
    if (on) { e.preventDefault(); openHit(on); }
  } else if (e.key === "Escape") {
    if (q.value) { q.value = ""; closeHits(); }
    else { closeHits(); q.blur(); }
  }
});
hits.addEventListener("click", e => {
  const a = e.target.closest(".hit");
  if (!a) return;
  e.preventDefault();
  openHit(a);
});
// "/" focuses the search from anywhere on the page — the one shortcut every
// docs site has — but never while the reader is already typing somewhere.
document.addEventListener("keydown", e => {
  if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
  const el = document.activeElement;
  if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return;
  e.preventDefault();
  if (window.matchMedia("(max-width: 980px)").matches) setToc(true);
  q.focus();
  q.select();
});

const current = () => (location.hash || "").replace("#", "") || DOCS[0].slug;
window.addEventListener("hashchange", () => load(current()).then(() => {
  if (!pendingJump) return;
  const h = document.getElementById(pendingJump);
  pendingJump = "";
  if (h) jumpTo(h);
}));
load(current()).then(restoreSideScroll);
</script>
</body>
</html>
