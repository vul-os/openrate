<script src="./assets/vendor/marked.umd.js"></script>
<script src="./assets/site.js" defer></script>
<script>
/* openrate docs viewer.
 *
 * site/docs/*.md is GENERATED from the canonical docs by `go run ./site/gen` —
 * never hand-edit those files. The DOCS array below is the nav contract: the
 * generator's test (site/gen/gen_test.go) parses it out of this file and fails
 * if it drifts from the pages actually generated, so keep it JSON-parseable and
 * keep every slug mirrored by a data-slug link in the sidebar above.
 */
const DOCS = [{"slug":"overview","title":"Overview"},{"slug":"api","title":"API reference"},{"slug":"configuration","title":"Configuration"},{"slug":"library","title":"Go library"},{"slug":"graph-model","title":"Graph model"},{"slug":"interest-rates","title":"Interest rates"},{"slug":"web-ui","title":"Web UI"},{"slug":"accuracy","title":"Accuracy"},{"slug":"sources","title":"Sources"}];

const bySlug = Object.fromEntries(DOCS.map(d => [d.slug, d]));
const content = document.getElementById("content");
const crumb = document.getElementById("crumb");
const cache = {};

if (window.marked && marked.setOptions) marked.setOptions({ gfm: true, breaks: false });

function setActive(slug) {
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.slug === slug));
}

async function fetchDoc(slug) {
  if (cache[slug] !== undefined) return cache[slug];
  const res = await fetch("./docs/" + slug + ".md", { cache: "no-cache" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  cache[slug] = await res.text();
  return cache[slug];
}

// A copy button per code block. Placed after render because the markdown is
// injected wholesale; navigator.clipboard is undefined on insecure origins, so
// a failure is swallowed rather than thrown into the console.
function addCopyButtons() {
  content.querySelectorAll("pre").forEach(pre => {
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.type = "button";
    btn.textContent = "copy";
    btn.addEventListener("click", () => {
      navigator.clipboard?.writeText(pre.querySelector("code")?.textContent ?? pre.textContent).then(
        () => { btn.textContent = "copied"; setTimeout(() => { btn.textContent = "copy"; }, 1400); },
        () => {}
      );
    });
    pre.appendChild(btn);
  });
}

async function load(slug) {
  const doc = bySlug[slug] || DOCS[0];
  setActive(doc.slug);
  crumb.textContent = doc.title;
  document.title = "openrate — " + doc.title;
  content.innerHTML = "Loading…";
  try {
    content.innerHTML = marked.parse(await fetchDoc(doc.slug));
    content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    addCopyButtons();
    window.scrollTo({ top: 0 });
  } catch (err) {
    content.innerHTML = '<div class="docs-err">Could not load <code>' + doc.slug +
      ".md</code> — " + err.message + "</div>";
  }
}

/* ── search ───────────────────────────────────────────────────────────────
 * Nine documents is small enough to search by fetching all of them once, on
 * the first keystroke, and scanning line by line. No index to build, nothing
 * to keep in sync with the generator, and it stays correct automatically. */
const q = document.getElementById("q");
const hits = document.getElementById("hits");
let corpus = null;

async function ensureCorpus() {
  if (corpus) return corpus;
  const bodies = await Promise.all(DOCS.map(d => fetchDoc(d.slug).catch(() => "")));
  corpus = DOCS.map((d, i) => ({ doc: d, lines: bodies[i].split("\n") }));
  return corpus;
}

function search(term) {
  const t = term.trim().toLowerCase();
  if (t.length < 2) { hits.hidden = true; hits.innerHTML = ""; return; }
  ensureCorpus().then(rows => {
    // Re-check: an await means the box may have changed since this ran.
    if (q.value.trim().toLowerCase() !== t) return;
    const out = [];
    for (const { doc, lines } of rows) {
      let n = 0;
      for (const line of lines) {
        if (n >= 3) break;
        const s = line.trim();
        if (s.length < 3 || s.startsWith("<!--") || !s.toLowerCase().includes(t)) continue;
        out.push({ doc, line: s.replace(/[#*`>|]/g, "").trim().slice(0, 90) });
        n++;
      }
    }
    hits.hidden = false;
    hits.innerHTML = out.length
      ? out.slice(0, 12).map(h =>
          '<a class="hit" href="#' + h.doc.slug + '"><b>' + h.doc.title + "</b><span>" +
          h.line.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</span></a>"
        ).join("")
      : '<div class="hits-none">Nothing matches “' +
        t.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "”.</div>";
  });
}

q.addEventListener("input", () => search(q.value));
hits.addEventListener("click", () => { q.value = ""; hits.hidden = true; hits.innerHTML = ""; });

const current = () => (location.hash || "").replace("#", "") || DOCS[0].slug;
window.addEventListener("hashchange", () => load(current()));
load(current());
</script>
