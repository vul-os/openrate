name: CI

on:
  push:
  pull_request:

jobs:
  # The release verifier is only worth having if its REFUSALS are exercised. A
  # checksum guard that has quietly stopped failing is indistinguishable, from a
  # green CI run, from one that works — so run the full synthetic-origin failure
  # matrix on every push, not only at release time.
  verify-script:
    name: Release verifier — lint & failure matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/verify.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh

      # 24 cases; each is a synthetic origin broken in exactly one way. The
      # matrix asserts the exit code AND that a diagnostic was printed, because
      # "aborted with no message" was the real-world bug being guarded against.
      - name: Failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest

  go-ci:
    name: Go build / test / vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # Formatting is a build gate, not a review comment.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
          echo "all files gofmt-clean"

      - name: Test
        run: go test ./...

      # The store swaps an immutable snapshot under an RWMutex while readers hit
      # it concurrently; several tests exist specifically to drive that race.
      # They only prove anything under -race.
      - name: Test (race detector)
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      # site/docs used to be a hand-made copy of the canonical docs, and it
      # drifted silently — that drift is how four EMPTY link targets shipped in
      # site/docs/api.md. site/docs is now generated by ./site/gen, and this
      # gate fails if the shipped bundle is stale, if a canonical doc is neither
      # published nor explicitly exempt, or if any link would be dead for a
      # visitor. It is run explicitly (not just via `go test ./...`) so the
      # failure is legible, and it asserts coverage floors so it cannot pass by
      # checking nothing.
      - name: Docs — site/docs generated, in sync, and link-clean
        run: go test ./site/gen -v

      # The web UI (web/ui.html) is hand-written HTML/CSS/JS with no build step
      # and is embedded verbatim by web/embed.go — there is no bundle that can
      # go stale relative to a source tree, because ui.html IS the source. The
      # boot-guard properties the old Playwright suite checked (the UI is
      # present, non-trivial, exposes the converter/board, references no
      # external origin) are asserted directly against the embedded bytes in
      # web/embed_test.go, which the Test step above already runs; this step
      # just makes that coverage legible in the CI log.
      - name: Web UI — embedded, self-contained, no external origins
        run: go test ./web -v
