name: CI

on:
  push:
  pull_request:

jobs:
  # The release verifier is only worth having if its REFUSALS are exercised. A
  # checksum guard that has quietly stopped failing is indistinguishable, from a
  # green CI run, from one that works — so run the full synthetic-origin failure
  # matrix on every push, not only at release time.
  verify-script:
    name: Release verifier — lint & failure matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/verify.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh

      # 24 cases; each is a synthetic origin broken in exactly one way. The
      # matrix asserts the exit code AND that a diagnostic was printed, because
      # "aborted with no message" was the real-world bug being guarded against.
      - name: Failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest

  go-ci:
    name: Go build / test / vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # Formatting is a build gate, not a review comment.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
          echo "all files gofmt-clean"

      - name: Test
        run: go test ./...

      # The store swaps an immutable snapshot under an RWMutex while readers hit
      # it concurrently; several tests exist specifically to drive that race.
      # They only prove anything under -race.
      - name: Test (race detector)
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      # site/docs used to be a hand-made copy of the canonical docs, and it
      # drifted silently — that drift is how four EMPTY link targets shipped in
      # site/docs/api.md. site/docs is now generated by ./site/gen, and this
      # gate fails if the shipped bundle is stale, if a canonical doc is neither
      # published nor explicitly exempt, or if any link would be dead for a
      # visitor. It is run explicitly (not just via `go test ./...`) so the
      # failure is legible, and it asserts coverage floors so it cannot pass by
      # checking nothing.
      - name: Docs — site/docs generated, in sync, and link-clean
        run: go test ./site/gen -v

      # The web UI (serve/web/ui.html) is hand-written HTML/CSS/JS with no build
      # step and is embedded verbatim by serve/web/embed.go — there is no bundle
      # that can go stale relative to a source tree, because ui.html IS the
      # source. The boot-guard properties the old Playwright suite checked (the
      # UI is present, non-trivial, exposes the converter/board, references no
      # external origin) are asserted directly against the embedded bytes in
      # serve/web/embed_test.go, which the Test step above already runs; this
      # step just makes that coverage legible in the CI log.
      - name: Web UI — embedded, self-contained, no external origins
        run: go test ./serve/web -v

      # The UI is optional: `-tags noui` compiles the console out entirely and
      # serve mounts a JSON stub in its place. A build tag nothing exercises is
      # a build tag that quietly stops compiling, so the tagged state is built,
      # vetted and tested here — not just built.
      - name: Build and test without the UI (-tags noui)
        run: |
          go build -tags noui ./...
          go vet -tags noui ./...
          go test -tags noui ./...

      # Pinned rather than relying on whatever the runner image happens to
      # carry: both gates below are plain ESM with no dependencies, and the
      # only thing that could break them is a Node old enough to lack
      # String.replaceAll.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Two site gates that need no browser and no network. Both are
      # mutation-tested by their own --selftest, and the selftest runs FIRST:
      # a checker that cannot fail is not evidence, and this repo has shipped
      # that shape before.
      - name: Site — muted text tiers measured against WCAG AA
        run: |
          node scripts/check-contrast.mjs --selftest
          node scripts/check-contrast.mjs --report

      # The suite's canonical chrome gate is vulos-cloud's
      # check-suite-chrome.mjs; it is not runnable from here because that
      # repository is not a dependency of this one. This mirrors ONE of its
      # rules — no <footer> on a docs page — for the reason slipscan's footer
      # regression survived for weeks: a gate that only runs in another repo
      # does not run. The rest of what this checks is not covered anywhere.
      - name: Site — docs chrome, and no outbound origin anywhere in site/
        run: |
          node scripts/check-docs-chrome.mjs --selftest
          node scripts/check-docs-chrome.mjs

  # openrate is a library first and a server second, and every part of that
  # claim is invisible to the job above. `go test ./...` runs INSIDE the module,
  # where internal/ is reachable, nothing distinguishes a package the pure core
  # may import from one it may not, and a binary's contents are not something a
  # test asks about. Each step here is a property that can rot without a single
  # existing test going red.
  #
  # embedtest/ is a second Go module (see its go.mod) and is therefore skipped
  # by the root module's ./... — it only runs because this job runs it, which is
  # exactly why every invocation goes through scripts/go-test-gate.sh with a
  # floor and a list of required test names. A step that silently stopped
  # executing anything would otherwise be a green tick over nothing.
  embeddability:
    name: Embeddability — public API, cold construction, import direction, UI linkage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt & vet the embeddability module
        working-directory: embedtest
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go vet -tags noui ./...

      # G1 the internal/ wall holds and the public API is sufficient
      # G2 constructing the library starts no goroutine, sends no packet, reads
      #    no environment
      # G3 fx and fxsource depend on nothing above them, and only the deprecated
      #    Start shim reaches the server
      # G5 the default build serves the console
      - name: G1–G3, G5 — embeddability suite (default build)
        working-directory: embedtest
        run: |
          bash ../scripts/go-test-gate.sh \
            --min 8 \
            --require TestG1EngineIsUsableFromAnotherModule \
            --require TestG1InternalPackagesStayUnreachable \
            --require TestG2ColdConstructionMakesZeroRoundTrips \
            --require TestG2ColdConstructionStartsNoGoroutines \
            --require TestG2ColdConstructionAdoptsNoEnvironmentKey \
            --require TestG3ImportDirection \
            --require TestG3RootDependsOnServeOnlyThroughTheDeprecatedShim \
            --require TestG5DefaultBuildServesTheConsole \
            -- ./...

      # The same suite against the console-less build. Same floor, same required
      # names, except that the "/" expectation inverts: the stub, not the page.
      - name: G1–G3, G5 — embeddability suite (-tags noui)
        working-directory: embedtest
        run: |
          bash ../scripts/go-test-gate.sh \
            --min 8 \
            --require TestG1EngineIsUsableFromAnotherModule \
            --require TestG1InternalPackagesStayUnreachable \
            --require TestG2ColdConstructionMakesZeroRoundTrips \
            --require TestG2ColdConstructionStartsNoGoroutines \
            --require TestG2ColdConstructionAdoptsNoEnvironmentKey \
            --require TestG3ImportDirection \
            --require TestG3RootDependsOnServeOnlyThroughTheDeprecatedShim \
            --require TestG5NoUIBuildServesTheJSONStub \
            -- -tags noui ./...

      # Builds both binaries and measures: the console must be in one and not
      # the other, and noui must save at least 90% of the bytes serve/web
      # embeds. "Measurably smaller" has to be a measurement.
      - name: G5 — noui is a real saving, not a compiled-out handler over the same bytes
        run: bash scripts/check-ui-builds.sh

      # The strongest form of the claim: a host importing ONLY the library links
      # none of the console, even though serve/web is reachable through its
      # import graph via the deprecated Start. Checked against a control host
      # whose binary must contain the sentinel.
      - name: G7 — importing the library links no UI bytes
        run: bash scripts/check-embed-linkage.sh

  # The C ABI (ffi/) is what every non-Go language loads. It is a THIRD Go
  # module — github.com/vul-os/openrate-ffi, deliberately outside the parent
  # import prefix so Go's internal/ rule applies to it — which means the root
  # module's ./... does not build it, vet it or test it. Everything about it
  # therefore has to be run from here, or it is not run at all.
  #
  # Both operating systems, because the artifact differs (.so vs .dylib), the
  # loader differs, and the smoke test's socket census reads file descriptors,
  # which is exactly the kind of thing that is correct on one platform and
  # quietly wrong on the other.
  ffi:
    name: C ABI — build, dlopen, smoke test, mutation matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt & vet the ffi module
        working-directory: ffi
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
          go vet ./...

      # The ffi module has no `require` beyond openrate itself, and must not
      # grow one: a third-party dependency here would be a dependency inside
      # every language binding that loads the shared library.
      - name: The C ABI stays stdlib-only
        working-directory: ffi
        run: |
          if [ -f go.sum ] && [ -s go.sum ]; then
            echo "::error::ffi/go.sum is non-empty — the C ABI has acquired a third-party dependency."
            cat go.sum
            exit 1
          fi
          # Standard-library packages have no Module, so listing the modules a
          # build pulls in is the exact question. (Do not grep the package list
          # instead: net/http's dependencies include vendor/golang.org/x/net/...,
          # which look like third-party paths and are not.)
          mods="$(go list -deps -f '{{if .Module}}{{.Module.Path}}{{end}}' ./... | sort -u | grep -v '^$')"
          echo "$mods"
          extra="$(echo "$mods" | grep -v '^github.com/vul-os/openrate$' | grep -v '^github.com/vul-os/openrate-ffi$' || true)"
          if [ -n "$extra" ]; then
            echo "::error::the C ABI depends on modules other than openrate itself:"
            echo "$extra"
            exit 1
          fi
          echo "stdlib only, plus openrate itself"

      # Run through the gate, not bare: this suite lives in a module the root
      # ./... skips, which makes it precisely the kind of thing that can stop
      # executing while the step still shows a green tick. The floor and the
      # required names are what turn "it ran" into a claim.
      - name: The ABI's Go-side suite — wire parity, version, packet count
        working-directory: ffi
        run: |
          bash ../scripts/go-test-gate.sh \
            --min 16 \
            --require TestTheInternalWallHoldsForTheABI \
            --require TestHandlesAreNeverReused \
            --require TestZeroPacketsThroughTheABI \
            --require TestEngineConstructionThroughTheABIStartsNoGoroutine \
            --require TestWireParityWithTheHTTPAPI \
            --require TestWireParityCheckCanFail \
            --require TestMetaReportsRefresherStatusLikeTheHTTPAPI \
            --require TestVersionMatchesTheVERSIONFile \
            --require TestHeaderDeclaresTheSameVersion \
            --require TestHeaderDeclaresEveryExportedSymbol \
            --require TestRefresherFetchesOnlyWhenAskedThroughTheABI \
            --require TestTheBackgroundLoopIsOptInAndStoppable \
            --require TestAnEngineHandleIsNotARefresherHandle \
            -- -race ./...

      - name: ShellCheck the FFI scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/build-ffi.sh scripts/check-ffi.sh scripts/bench-ffi.sh

      # Builds the real shared library, dlopens it from a C program that links
      # nothing, runs 40 checks through it — and then breaks the library four
      # ways and requires the same C program to reject each one. A smoke test
      # that passes is only evidence if it is capable of failing.
      - name: dlopen the library, drive it from C, and prove the test can fail
        run: bash scripts/check-ffi.sh --selftest

      # The benchmark is documentation, and documentation that no longer
      # compiles is worse than none. A short run keeps it honest without
      # pretending CI runners produce publishable timings — the numbers in
      # ffi/README.md are from a quiet machine, and say which one.
      - name: The in-process vs loopback benchmark still runs
        run: bash scripts/bench-ffi.sh 2000

      # Reports what this runner could and could not build. Cross targets
      # without a toolchain are printed as skipped, never omitted.
      - name: Build the shared library for every target this runner can
        run: bash scripts/build-ffi.sh

  # The landing page's product captures were blurry and silently cropped for a
  # release, because the capture's aspect (1.33) and the display box's (0.92)
  # disagreed and `object-fit: cover` resolved the disagreement by discarding the
  # difference. Nothing in a diff showed it and nothing failed. The CSS is now
  # `contain`, which converts that silent crop into visible letterboxing — but
  # "visible" means a human has to be looking at the right page at the right
  # width. This job is the check that does not need one, and its --selftest pass
  # breaks the page five ways first to prove the refusals still fire.
  landing-shots:
    name: Landing screenshots — frame drift & pixel density
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Playwright is not vendored: this repo ships no npm tree and no lockfile,
      # and the landing is plain HTML/CSS with no build step. It is installed
      # here, for this job only, and --no-save keeps it out of the checkout.
      - name: Install Playwright (chromium only)
        run: |
          set -euo pipefail
          npm install --no-save --silent playwright@1
          npx --yes playwright install --with-deps chromium

      # --selftest first breaks the page five ways and asserts each is refused,
      # then runs the real matrix (every capture x 4 widths x both themes).
      - name: Every capture is its box's shape, and at least 2x sampled
        run: node scripts/check-shots.mjs --selftest
